<h2 class="mb-4">❤ My Favorites</h2>

@if (error()) {
  <div class="alert alert-danger" role="alert">{{ error() }}</div>
} @else if (visible(); as list) {
  @if (list.length === 0) {
    <p class="text-muted">You have no favorite products yet.</p>
    <a routerLink="/products" class="btn btn-warning">Browse Products</a>
  } @else {
    <div class="row g-4">
      @for (product of list; track product.id) {
        <div class="col-6 col-md-4 col-lg-3">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  }
} @else {
  <p class="text-muted">Loading...</p>
}
